spring:
  application:
    name: edumanager-api-gateway

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      password: redis_password
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: gateway-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1 hour

  # Cloud Gateway Configuration
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Tenant Service Routes
        - id: tenant-service
          uri: lb://edumanager-tenant
          predicates:
            - Path=/api/tenant/**
          filters:
            - StripPrefix=1
            - name: TenantHeaderFilter

        # Enrollment Service Routes
        - id: enrollment-service
          uri: lb://edumanager-enrollment
          predicates:
            - Path=/api/enrollment/**
          filters:
            - StripPrefix=1
            - name: TenantHeaderFilter

        # Academic Service Routes
        - id: academic-service
          uri: lb://edumanager-academic
          predicates:
            - Path=/api/academic/**
          filters:
            - StripPrefix=1
            - name: TenantHeaderFilter

        # Financial Service Routes
        - id: financial-service
          uri: lb://edumanager-financial
          predicates:
            - Path=/api/financial/**
          filters:
            - StripPrefix=1
            - name: TenantHeaderFilter

        # HR Service Routes
        - id: hr-service
          uri: lb://edumanager-hr
          predicates:
            - Path=/api/hr/**
          filters:
            - StripPrefix=1
            - name: TenantHeaderFilter

        # Communication Service Routes
        - id: communication-service
          uri: lb://edumanager-communication
          predicates:
            - Path=/api/communication/**
          filters:
            - StripPrefix=1
            - name: TenantHeaderFilter

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

# Server Configuration
server:
  port: 8080

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Application Configuration
edumanager:
  # JWT Configuration
  jwt:
    secret: ${JWT_SECRET:your-super-secret-key-for-jwt-token-generation-should-be-at-least-256-bits}
    expiration: 3600 # 1 hour
    refresh-expiration: 604800 # 7 days

# Management Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Logging Configuration
logging:
  level:
    root: INFO
    com.edumanager: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/gateway-service.log
