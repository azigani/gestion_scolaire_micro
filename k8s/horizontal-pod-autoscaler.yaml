apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edumanager-tenant-hpa
  namespace: edumanager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edumanager-tenant
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edumanager-api-gateway-hpa
  namespace: edumanager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edumanager-api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
