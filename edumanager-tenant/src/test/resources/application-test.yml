spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms

edumanager:
  jwt:
    secret: test-secret-key-for-jwt-token-generation-should-be-at-least-256-bits
    expiration: 3600000
