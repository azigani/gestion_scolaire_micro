apiVersion: apps/v1
kind: Deployment
metadata:
  name: edumanager-hr
  namespace: edumanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edumanager-hr
  template:
    metadata:
      labels:
        app: edumanager-hr
    spec:
      containers:
      - name: edumanager-hr
        image: edumanager/hr:latest
        ports:
        - containerPort: 8085
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: edumanager-config
              key: SPRING_PROFILES_ACTIVE
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: edumanager-secret
              key: POSTGRES_PASSWORD
        - name: SPRING_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: edumanager-secret
              key: REDIS_PASSWORD
        - name: EDUMANAGER_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: edumanager-secret
              key: JWT_SECRET
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8085
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8085
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: edumanager-hr
  namespace: edumanager
spec:
  selector:
    app: edumanager-hr
  ports:
  - port: 8085
    targetPort: 8085
  type: ClusterIP
