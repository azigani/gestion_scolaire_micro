apiVersion: apps/v1
kind: Deployment
metadata:
  name: edumanager-frontend
  namespace: edumanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edumanager-frontend
  template:
    metadata:
      labels:
        app: edumanager-frontend
    spec:
      containers:
      - name: edumanager-frontend
        image: edumanager/frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: edumanager-frontend
  namespace: edumanager
spec:
  selector:
    app: edumanager-frontend
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edumanager-frontend-ingress
  namespace: edumanager
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - edumanager.com
    secretName: edumanager-frontend-tls
  rules:
  - host: edumanager.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: edumanager-frontend
            port:
              number: 80
