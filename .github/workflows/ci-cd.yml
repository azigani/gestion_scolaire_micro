name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [tenant, enrollment, academic, financial, hr, communication, api-gateway]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build ${{ matrix.service }}
      run: mvn clean install -DskipTests -pl edumanager-${{ matrix.service }}
    
    - name: Test ${{ matrix.service }}
      run: mvn test -pl edumanager-${{ matrix.service }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: edumanager-frontend/package-lock.json
    
    - name: Install dependencies
      run: cd edumanager-frontend && npm install
    
    - name: Build frontend
      run: cd edumanager-frontend && npm run build
    
    - name: Test frontend
      run: cd edumanager-frontend && npm test -- --watch=false --browsers=ChromeHeadless

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-and-test, build-frontend]
    
    strategy:
      matrix:
        service: [tenant, enrollment, academic, financial, hr, communication, api-gateway, frontend]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push ${{ matrix.service }}
      uses: docker/build-push-action@v4
      with:
        context: ./edumanager-${{ matrix.service }}
        push: true
        tags: edumanager/${{ matrix.service }}:latest, edumanager/${{ matrix.service }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
    
    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/
        kubectl rollout restart deployment/edumanager-tenant
        kubectl rollout restart deployment/edumanager-enrollment
        kubectl rollout restart deployment/edumanager-academic
        kubectl rollout restart deployment/edumanager-financial
        kubectl rollout restart deployment/edumanager-hr
        kubectl rollout restart deployment/edumanager-communication
        kubectl rollout restart deployment/edumanager-api-gateway
