global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'edumanager-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8081'  # tenant-service
          - 'host.docker.internal:8082'  # enrollment-service
          - 'host.docker.internal:8083'  # academic-service
          - 'host.docker.internal:8084'  # financial-service
          - 'host.docker.internal:8085'  # hr-service
          - 'host.docker.internal:8086'  # communication-service
          - 'host.docker.internal:8080'  # gateway
