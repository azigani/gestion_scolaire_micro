<div class="classes-container">
  <div class="header">
    <h1>{{ title }}</h1>
    <button mat-raised-button color="primary" (click)="openDialog()">
      <mat-icon>add</mat-icon>
      Add Class
    </button>
  </div>

  <div class="search-bar">
    <mat-form-field appearance="fill" class="search-field">
      <mat-label>Search classes</mat-label>
      <input matInput [(ngModel)]="searchTerm" (keyup.enter)="searchClasses()" placeholder="Search by name, teacher...">
      <button mat-icon-button matSuffix (click)="searchClasses()">
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <div class="table-container">
    <mat-table [dataSource]="classes" class="mat-elevation-z8">
      <ng-container matColumnDef="id">
        <mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
        <mat-cell *matCellDef="let class">{{ class.id }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="name">
        <mat-header-cell *matHeaderCellDef>Class Name</mat-header-cell>
        <mat-cell *matCellDef="let class">{{ class.name }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="grade">
        <mat-header-cell *matHeaderCellDef>Grade</mat-header-cell>
        <mat-cell *matCellDef="let class">Grade {{ class.grade }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="teacher">
        <mat-header-cell *matHeaderCellDef>Teacher</mat-header-cell>
        <mat-cell *matCellDef="let class">{{ class.teacher }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="capacity">
        <mat-header-cell *matHeaderCellDef>Capacity</mat-header-cell>
        <mat-cell *matCellDef="let class">{{ class.capacity }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="enrolled">
        <mat-header-cell *matHeaderCellDef>Enrolled</mat-header-cell>
        <mat-cell *matCellDef="let class">{{ class.enrolled || 0 }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="status">
        <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
        <mat-cell *matCellDef="let class">
          <span [class]="getStatusClass(class.status)">{{ class.status }}</span>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
        <mat-cell *matCellDef="let class">
          <button mat-icon-button (click)="openDialog(class)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteClass(class.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

    <div *ngIf="isLoading" class="loading">
      <mat-spinner></mat-spinner>
    </div>

    <div *ngIf="!isLoading && classes.length === 0" class="no-data">
      <p>No classes found</p>
    </div>
  </div>
</div>
